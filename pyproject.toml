[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geometry-of-safety"
version = "0.1.0"
description = "Mapping and hardening refusal mechanisms in aligned language models."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Maaz Shamim" }, { name = "Rashed Aldulijan" }]
dependencies = [
    "torch",
    "transformers>=4.43", # first release that supports Llama 3.1
    "accelerate",
    "datasets",
    "peft",               # LoRA fine-tuning for the defenses (E5, E6)
    "numpy",
    "pandas",
    "matplotlib",
    "pyyaml",
    "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["src/geometry_of_safety"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
